name: False negative (missed issue)
description: Pandaward did not report a real problem.
title: "[false-negative] "
labels: [false-negative, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a miss. `pandaward feedback false-negative --rule <rule or control> --note "..."` prefills this form.
        **Do not paste secrets, private code or exploit details for systems you do not own.** A minimal made-up example is the most useful thing you can give.
  - type: input
    id: rule
    attributes:
      label: Rule or control
      description: The rule that should have fired, or the control (for example `D-003`). Leave `unknown` if no rule covers it.
      placeholder: D-003
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pandaward version
      description: Output of `pandaward version`.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: The report from `pandaward feedback`, the language or file type, and which adapters ran (`pandaward status`).
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: A small, made-up snippet that has the problem and should be reported.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no secrets, private code, internal hostnames or customer data.
          required: true
