name: owasp-benchmark

# Measures the built-in rules on the OWASP Benchmark for Java at the commit
# pinned in tools/owaspbench/run.sh. Manual only; see docs/BENCHMARKS.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Measure
        run: |
          sh tools/owaspbench/run.sh --json > owasp-benchmark.json
          jq -r '.categories[] | [.category, (if .covered then (.score | tostring) else "not covered" end)] | @tsv' owasp-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owasp-benchmark
          path: owasp-benchmark.json
