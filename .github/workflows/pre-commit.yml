name: pre-commit

on:
  push:
    branches: [main]
    paths: [.pre-commit-hooks.yaml, .github/workflows/pre-commit.yml]
  pull_request:
    paths: [.pre-commit-hooks.yaml, .github/workflows/pre-commit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pre-commit
        # Every package pinned by hash (regenerate with pip-compile
        # --generate-hashes from .github/requirements/pre-commit.in).
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/pre-commit.txt
      - name: Hooks block a project with high findings
        run: |
          repo="$PWD"
          fx="$RUNNER_TEMP/fixture"
          go run ./tools/demofixture "$fx"
          go build -o "$RUNNER_TEMP/bin/pandaward$( [ "$RUNNER_OS" = Windows ] && echo .exe)" ./cmd/pandaward
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd "$fx"
          git init -q 2>/dev/null || true
          git -c user.name=ci -c user.email=ci@example.invalid add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm fixture || true
          pandaward init >/dev/null
          for hook in pandaward pandaward-system; do
            if pre-commit try-repo "$repo" "$hook" --all-files; then
              echo "$hook did not block high findings"
              exit 1
            fi
          done
      - name: Hooks pass a clean project
        run: |
          repo="$PWD"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          clean="$RUNNER_TEMP/clean"
          mkdir -p "$clean"
          cd "$clean"
          git init -q
          printf 'print("hello")\n' > app.py
          git -c user.name=ci -c user.email=ci@example.invalid add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm clean
          pandaward init >/dev/null
          pre-commit try-repo "$repo" pandaward-system --all-files
