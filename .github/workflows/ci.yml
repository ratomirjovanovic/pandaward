name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/pensec
      # Release-blocking: the hostile-repository suite must pass on every OS.
      - name: Self-test against a hostile repository
        run: go run ./cmd/pensec selftest
      - name: Launcher verification
        if: runner.os != 'Windows'
        run: sh packaging/test-launcher.sh
      - name: Rule benchmark
        if: runner.os == 'Linux'
        run: go run ./cmd/pensec benchmark --strict --json > benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: benchmark
          path: benchmark.json

  # Runs the optional scanner adapters against the real tools. Versions are
  # pinned with checksums from their release pages; keep README.md in sync.
  real-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SEMGREP_VERSION: 1.182.0
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install pinned scanners
        run: |
          set -eu
          bin="$RUNNER_TEMP/tools/bin"
          dl="$RUNNER_TEMP/tools/dl"
          mkdir -p "$bin" "$dl"
          cd "$dl"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tar.gz "$OSV_SCANNER_SHA256" osv-scanner "$TRIVY_SHA256" trivy.tar.gz | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$bin" gitleaks
          tar -xzf trivy.tar.gz -C "$bin" trivy
          install -m 0755 osv-scanner "$bin/osv-scanner"
          pipx install "semgrep==${SEMGREP_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          gitleaks version
          SEMGREP_ENABLE_VERSION_CHECK=0 semgrep --version
          osv-scanner --version
          trivy --version
      - name: Scan the demo fixture with the pensec CLI
        run: |
          set -eu
          go build -o "$RUNNER_TEMP/pensec" ./cmd/pensec
          fx="$RUNNER_TEMP/fixture"
          mkdir "$fx"
          go run ./tools/demofixture "$fx"
          cd "$fx"
          "$RUNNER_TEMP/pensec" init
          sed -i 's/allow_tool_network: false/allow_tool_network: true/' .pensec/config.yaml
          grep -q 'allow_tool_network: true' .pensec/config.yaml
          rc=0
          "$RUNNER_TEMP/pensec" scan --json > "$RUNNER_TEMP/scan.json" || rc=$?
          jq -r '.scan.runs[] | "\(.adapter) \(.tool_version) \(.exit_class) \(.signals) \(.detail)"' "$RUNNER_TEMP/scan.json"
          for a in gitleaks semgrep osv-scanner trivy; do
            jq -e --arg a "$a" '[.scan.runs[] | select(.adapter == $a and .exit_class == "OK" and .signals > 0)] | length == 1' "$RUNNER_TEMP/scan.json" >/dev/null || { echo "$a did not complete with signals"; exit 1; }
          done
          exit "$rc"
      - name: Real-tool adapter test
        env:
          PENSEC_REAL_TOOLS: "1"
        run: go test -count=1 -v -run '^TestRealTools$' ./internal/adapters/

  # Runs the ZAP adapter against a pinned ZAP and the fixture site, which
  # links to an out-of-scope origin that must never be contacted.
  real-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZAP_VERSION: 2.17.0
      ZAP_SHA256: efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install pinned ZAP
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fsSLo zap.tar.gz "https://github.com/zaproxy/zaproxy/releases/download/v${ZAP_VERSION}/ZAP_${ZAP_VERSION}_Linux.tar.gz"
          printf '%s  %s\n' "$ZAP_SHA256" zap.tar.gz | sha256sum -c -
          tar -xzf zap.tar.gz
          echo "PENSEC_ZAP_PATH=$RUNNER_TEMP/ZAP_${ZAP_VERSION}/zap.sh" >> "$GITHUB_ENV"
          java -version
      - name: Real ZAP adapter test
        env:
          PENSEC_REAL_ZAP: "1"
        run: go test -count=1 -v -timeout 15m -run '^TestRealZAP$' ./internal/zap/

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.11.0
      - name: Two builds give identical binaries and SBOM
        env:
          GOTOOLCHAIN: local
        run: |
          sh packaging/build-release.sh 0.0.0-ci a >/dev/null
          go clean -cache
          sh packaging/build-release.sh 0.0.0-ci b >/dev/null
          diff a/SHA256SUMS b/SHA256SUMS
          jq -e '[.components[] | select((.licenses // []) | length == 0)] | length == 0' a/pensec.cdx.json
