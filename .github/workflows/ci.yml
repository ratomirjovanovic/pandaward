name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/pensec
      - name: Launcher verification
        if: runner.os != 'Windows'
        run: sh packaging/test-launcher.sh
      - name: Rule benchmark
        if: runner.os == 'Linux'
        run: go run ./cmd/pensec benchmark --strict --json > benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: benchmark
          path: benchmark.json

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.11.0
      - name: Two builds give identical binaries and SBOM
        env:
          GOTOOLCHAIN: local
        run: |
          sh packaging/build-release.sh 0.0.0-ci a >/dev/null
          go clean -cache
          sh packaging/build-release.sh 0.0.0-ci b >/dev/null
          diff a/SHA256SUMS b/SHA256SUMS
          jq -e '[.components[] | select((.licenses // []) | length == 0)] | length == 0' a/pensec.cdx.json
