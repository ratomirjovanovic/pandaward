name: benchmarks

# Measures PandaWard on the OWASP Benchmarks for Java and Python and on the
# OpenSSF CVE Benchmark, with the built-in rules and the bundled Semgrep rules
# on Semgrep and Opengrep, and fails when a score drops below
# tools/benchgate/baseline.json. The OWASP suites run on pull requests that
# touch rules or engines; the CVE benchmark takes hours and runs weekly and
# on demand. See docs/BENCHMARKS.md.
on:
  pull_request:
    paths:
      - "rules/**"
      - "internal/adapters/**"
      - "internal/inventory/**"
      - "internal/config/**"
      - "tools/owaspbench/**"
      - "tools/cvebench/**"
      - "tools/benchgate/**"
      - "tools/internal/**"
      - ".github/workflows/benchmarks.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: 1.182.0
  OPENGREP_VERSION: 1.33.1
  OPENGREP_SHA256: 46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808
  GOTOOLCHAIN: local

jobs:
  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Semgrep and Opengrep
        run: |
          set -eu
          bin="$RUNNER_TEMP/tools/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/opengrep" "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "$OPENGREP_SHA256  $RUNNER_TEMP/opengrep" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/opengrep" "$bin/opengrep"
          pipx install "semgrep==${SEMGREP_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"
      - name: OWASP Benchmark for Java
        run: sh tools/owaspbench/run.sh --suite java --engine builtin,semgrep,opengrep --json > owasp-java.json
      - name: OWASP Benchmark for Python
        run: sh tools/owaspbench/run.sh --suite python --engine builtin,semgrep,opengrep --json > owasp-python.json
      - name: Compare with the baseline
        run: |
          set -o pipefail
          go run ./tools/benchgate --owasp owasp-java.json --owasp owasp-python.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: owasp-benchmarks
          path: owasp-*.json

  cve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Semgrep and Opengrep
        run: |
          set -eu
          bin="$RUNNER_TEMP/tools/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/opengrep" "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "$OPENGREP_SHA256  $RUNNER_TEMP/opengrep" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/opengrep" "$bin/opengrep"
          pipx install "semgrep==${SEMGREP_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"
      - name: OpenSSF CVE Benchmark
        env:
          CVEBENCH_WORK: ${{ runner.temp }}/cvebench
        run: sh tools/cvebench/run.sh --engine builtin,semgrep,opengrep --jobs 4 --json > cve.json
      - name: Compare with the baseline
        run: |
          set -o pipefail
          go run ./tools/benchgate --cve cve.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cve-benchmark
          path: cve.json
