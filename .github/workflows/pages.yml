name: pages

on:
  push:
    branches: [main]
  pull_request:
    paths: [site/**, internal/**, cmd/**, tools/**, .github/workflows/pages.yml]
  # A finished benchmarks run on main brings new numbers for the benchmark
  # page; site/build.sh reads only successful scheduled or manual runs.
  workflow_run:
    workflows: [benchmarks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Downloads the artifacts of the latest benchmarks run on main.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build site, demo and benchmark page
        env:
          GH_TOKEN: ${{ github.token }}
          # The benchmarks run that triggered this build, if any (#353).
          BENCH_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash site/build.sh
      - name: Check demo for leaked fixture secrets
        run: |
          if grep -rE 'sk_live_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}' site/_out; then
            echo "unredacted secret-shaped value in site output" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
