name: release

# On a version tag: build binaries for all platforms reproducibly, publish a
# GitHub release with checksums, a CycloneDX SBOM, build provenance and SBOM
# attestations (see docs/VERIFYING.md), and update the two plugin
# branches that the marketplace installs from:
#   plugin            macOS and Linux (launcher + binaries)
#   plugin-windows    Windows (pandaward.exe)
#   plugin-directory  macOS and Linux for the Claude plugin directory, which
#                     refuses files over 5 MiB: launcher, SHA256SUMS and
#                     RELEASE; the launcher fetches the verified binary
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check tag matches plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $ver" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Self-test against a hostile repository
        run: go run ./cmd/pandaward selftest

      - name: Install SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.11.0

      - name: Build
        env:
          GOTOOLCHAIN: local
        run: sh packaging/build-release.sh "${GITHUB_REF_NAME#v}" dist

      # The release binaries themselves, with the toolchain that built them.
      - name: govulncheck on the release binaries
        run: |
          for b in dist/pandaward-*; do
            case "$b" in *.sha256|*.sig|*.pem|*.json|*.txt|*.zip|*.mcpb) continue ;; esac
            echo "== $b"
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode binary "$b"
          done

      - name: Check the build is reproducible
        env:
          GOTOOLCHAIN: local
        run: |
          go clean -cache
          sh packaging/build-release.sh "${GITHUB_REF_NAME#v}" dist-check >/dev/null
          diff dist/SHA256SUMS dist-check/SHA256SUMS
          jq -e '[.components[] | select((.licenses // []) | length == 0)] | length == 0' dist/pandaward.cdx.json
          rm -rf dist-check

      - name: MCPB bundle for the MCP Registry
        run: sh packaging/build-mcpb.sh "${GITHUB_REF_NAME#v}" dist

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/pandaward-*

      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/pandaward-*
          sbom-path: dist/pandaward.cdx.json

      - name: Rule benchmark
        run: go run ./cmd/pandaward benchmark --strict --json > dist/benchmark.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "PandaWard $GITHUB_REF_NAME" --generate-notes --verify-tag \
            $(case "$GITHUB_REF_NAME" in *-*|v0.*) echo --prerelease ;; esac)

      - name: Update plugin branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          plugin_files=".claude-plugin/plugin.json .claude-plugin/icon.png skills agents hooks LICENSE NOTICE README.md SECURITY.md"

          publish() {
            branch=$1
            stage=$(mktemp -d)
            for f in $plugin_files; do
              [ -e "$f" ] && cp -R --parents "$f" "$stage/"
            done
            # Marketplace clones must not rewrite line endings, or SHA256SUMS
            # and the launcher break on checkouts with core.autocrlf.
            printf '* -text\n' > "$stage/.gitattributes"
            mkdir -p "$stage/bin"
            if [ "$branch" = plugin-windows ]; then
              cp dist/pandaward-windows-amd64.exe "$stage/bin/pandaward.exe"
              (cd "$stage/bin" && sha256sum pandaward.exe > SHA256SUMS)
            elif [ "$branch" = plugin-directory ]; then
              cp packaging/launcher.sh "$stage/bin/pandaward"
              chmod 0755 "$stage/bin/pandaward"
              (cd dist && sha256sum pandaward-linux-amd64 pandaward-linux-arm64 pandaward-darwin-amd64 pandaward-darwin-arm64) > "$stage/bin/SHA256SUMS"
              echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" > "$stage/bin/RELEASE"
              big=$(find "$stage" -type f -size +5M)
              [ -z "$big" ] || { echo "files over 5 MiB in $branch: $big" >&2; exit 1; }
            else
              cp dist/pandaward-linux-amd64 dist/pandaward-linux-arm64 dist/pandaward-darwin-amd64 dist/pandaward-darwin-arm64 "$stage/bin/"
              cp packaging/launcher.sh "$stage/bin/pandaward"
              chmod 0755 "$stage/bin/pandaward" "$stage/bin"/pandaward-*
              (cd "$stage/bin" && sha256sum pandaward-* > SHA256SUMS)
            fi
            wt=$(mktemp -d)
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git fetch -q origin "$branch"
              git worktree add -q "$wt" "origin/$branch"
              git -C "$wt" switch -q -C "$branch"
            else
              git worktree add -q --detach "$wt"
              git -C "$wt" switch -q --orphan "$branch"
            fi
            git -C "$wt" rm -rq --ignore-unmatch .
            cp -R "$stage"/. "$wt"/
            git -C "$wt" add -A
            if [ "$branch" = plugin-directory ]; then
              git -C "$wt" update-index --chmod=+x bin/pandaward
            elif [ "$branch" = plugin ]; then
              git -C "$wt" update-index --chmod=+x bin/pandaward bin/pandaward-linux-amd64 bin/pandaward-linux-arm64 bin/pandaward-darwin-amd64 bin/pandaward-darwin-arm64
            fi
            git -C "$wt" commit -q -m "PandaWard $GITHUB_REF_NAME for $branch" -m "Built from $(git rev-parse HEAD) by the release workflow."
            git -C "$wt" push -q origin "$branch"
            git worktree remove --force "$wt"
          }
          publish plugin
          publish plugin-windows
          publish plugin-directory
