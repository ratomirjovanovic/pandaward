name: rule-quality

# Groups open false positive and false negative reports by rule, labels
# them with the rule and a priority, and keeps the "Rule quality" issue up
# to date. Issue text is untrusted: it is only parsed by tools/rulequality,
# which reduces rule names to [a-z0-9._-]; nothing from it reaches a shell.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rule-quality
  cancel-in-progress: false

jobs:
  # `pandaward feedback submit` files reports with gh, which cannot apply the
  # issue form's labels for people without write access. Label them by the
  # title prefix PandaWard writes, so they reach the dashboard. Labels added
  # with GITHUB_TOKEN do not start a new run, so update runs after this job.
  label:
    if: github.event_name == 'issues' && github.event.action == 'opened' && (startsWith(github.event.issue.title, '[false-positive]') || startsWith(github.event.issue.title, '[false-negative]'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      KIND: ${{ startsWith(github.event.issue.title, '[false-positive]') && 'false-positive' || 'false-negative' }}
    steps:
      - name: Label the report
        run: gh issue edit "$NUMBER" --add-label "$KIND" --add-label needs-triage

  update:
    needs: label
    if: >-
      always() && (github.event_name != 'issues' ||
      contains(join(github.event.issue.labels.*.name, ','), 'false-') ||
      startsWith(github.event.issue.title, '[false-positive]') ||
      startsWith(github.event.issue.title, '[false-negative]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the plan
        run: |
          # REST pagination has no result cap, unlike search.
          for l in false-positive false-negative; do
            gh api --paginate "repos/$GH_REPO/issues?state=open&labels=$l&per_page=100"
          done > "$RUNNER_TEMP/issues.json"
          go run ./tools/rulequality < "$RUNNER_TEMP/issues.json" > "$RUNNER_TEMP/plan.json"
          jq -r '.groups[] | "\(.priority) \(.rule) score=\(.score)"' "$RUNNER_TEMP/plan.json"
      - name: Apply labels
        run: |
          plan="$RUNNER_TEMP/plan.json"
          jq -r '[.labels[].add[]] | unique[]' "$plan" | while IFS= read -r l; do
            case "$l" in
              priority:P1) color=b60205 ;;
              priority:P2) color=fbca04 ;;
              priority:P3) color=c2e0c6 ;;
              *) color=ededed ;;
            esac
            gh label create "$l" --color "$color" --force >/dev/null
          done
          jq -c '.labels[]' "$plan" | while IFS= read -r c; do
            n=$(jq -r '.issue' <<<"$c")
            args=()
            while IFS= read -r l; do [ -n "$l" ] && args+=(--add-label "$l"); done < <(jq -r '.add[]?' <<<"$c")
            while IFS= read -r l; do [ -n "$l" ] && args+=(--remove-label "$l"); done < <(jq -r '.remove[]?' <<<"$c")
            [ ${#args[@]} -eq 0 ] || gh issue edit "$n" "${args[@]}"
          done
      - name: Update the dashboard issue
        run: |
          jq -r '.dashboard' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/dashboard.md"
          gh label create rule-quality --color 5319e7 --description "Rule quality dashboard" --force >/dev/null
          n=$(gh issue list --state open --label rule-quality --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            gh issue create --title "Rule quality dashboard" --label rule-quality --body-file "$RUNNER_TEMP/dashboard.md"
          else
            gh issue edit "$n" --body-file "$RUNNER_TEMP/dashboard.md"
          fi
