name: PandaWard
description: Local, evidence-based application security assessment. Passive scan with SARIF output and an optional gate.
author: Ratomir Jovanovic
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: PandaWard release to download (without the leading v)
    default: "0.2.5"
  working-directory:
    description: Project directory to scan
    default: "."
  fail-on:
    description: Fail when open, non-hypothesis findings at or above this severity exist (critical, high, medium, low); empty never fails on findings
    default: "high"
  new-only:
    description: With a base ref, gate and summarize only findings that are not already present at the base ("true" or "false")
    default: "false"
  base-ref:
    description: Commit or ref to compare against when new-only is true (default for pull requests is the base commit)
    default: ""
  output-dir:
    description: Directory for reports, relative to the workspace
    default: "pandaward-report"
  summary:
    description: Job summary detail. "counts" (default) shows numbers only, "full" also lists findings with file and line, "none" writes nothing. Job summaries of public repositories are public.
    default: "counts"

outputs:
  sarif-file:
    description: Path of the SARIF report
    value: ${{ steps.report.outputs.sarif }}
  findings:
    description: Number of open findings considered by the gate
    value: ${{ steps.gate.outputs.findings }}
  gated:
    description: Number of considered findings at or above fail-on
    value: ${{ steps.gate.outputs.gated }}

runs:
  using: composite
  steps:
    - name: Install PandaWard
      shell: bash
      env:
        PANDAWARD_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=pandaward-linux-amd64 ;;
          Linux-ARM64) asset=pandaward-linux-arm64 ;;
          macOS-X64) asset=pandaward-darwin-amd64 ;;
          macOS-ARM64) asset=pandaward-darwin-arm64 ;;
          Windows-X64) asset=pandaward-windows-amd64.exe ;;
          *) echo "::error::PandaWard has no release binary for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
        esac
        case "$PANDAWARD_VERSION" in
          *[!0-9A-Za-z.-]* | "") echo "::error::invalid version '$PANDAWARD_VERSION'"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/pandaward-bin"
        mkdir -p "$dir"
        cd "$dir"
        base="https://github.com/ratomirjovanovic/pandaward/releases/download/v$PANDAWARD_VERSION"
        curl -fsSL --retry 3 -o "$asset" "$base/$asset"
        curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
        want=$(awk -v n="$asset" '{ sub(/\r$/, "") } $2 == n || $2 == "*" n { print $1 }' SHA256SUMS)
        if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum "$asset" | awk '{print $1}'); else got=$(shasum -a 256 "$asset" | awk '{print $1}'); fi
        if [ -z "$want" ] || [ "$got" != "$want" ]; then
          echo "::error::checksum mismatch for $asset; refusing to run it"
          exit 1
        fi
        if [ "$RUNNER_OS" = Windows ]; then mv "$asset" pandaward.exe; else mv "$asset" pandaward && chmod +x pandaward; fi
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/pandaward" version

    - name: Scan the base for comparison
      if: inputs.new-only == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [ -z "$BASE_REF" ]; then
          echo "::error::new-only needs base-ref outside pull_request events"
          exit 1
        fi
        top=$(git rev-parse --show-toplevel)
        rel=$(git rev-parse --show-prefix)
        git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
        base="$RUNNER_TEMP/pandaward-base"
        rm -rf "$base"
        git -C "$top" -c core.hooksPath=/dev/null worktree add --detach "$base" "$BASE_REF" >/dev/null
        cd "$base/$rel"
        pandaward init >/dev/null
        pandaward scan --quiet >/dev/null
        pandaward findings --json > "$RUNNER_TEMP/pandaward-base-findings.json"
        cd "$top"
        git worktree remove --force "$base"

    - name: Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        [ -f .pandaward/config.yaml ] || pandaward init >/dev/null
        pandaward scan --quiet
        pandaward findings --json > "$RUNNER_TEMP/pandaward-findings.json"

    - name: Report
      id: report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OUT: ${{ github.workspace }}/${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        pandaward report --format sarif,html,markdown,json --out "$OUT"
        echo "sarif=$(ls "$OUT"/*.sarif | head -n 1)" >> "$GITHUB_OUTPUT"

    - name: Gate and summary
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        NEW_ONLY: ${{ inputs.new-only }}
        SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        # jq on Windows runners may end lines with CRLF.
        num() { jq "$@" | tr -d '\r'; }
        head="$RUNNER_TEMP/pandaward-findings.json"
        base="$RUNNER_TEMP/pandaward-base-findings.json"
        rank='{"critical":4,"high":3,"medium":2,"low":1,"info":0}'
        if [ "$NEW_ONLY" = true ] && [ -f "$base" ]; then
          sel=$(jq --slurpfile b "$base" '[.[] | select(.fingerprint as $f | ($b[0] | map(.fingerprint) | index($f)) | not)]' "$head")
          scope="new in this change"
        else
          sel=$(cat "$head")
          scope="open"
        fi
        sel=$(jq '[.[] | select(.confidence != "HYPOTHESIS")]' <<<"$sel")
        findings=$(num length <<<"$sel")
        gated=0
        if [ -n "$FAIL_ON" ]; then
          case "$FAIL_ON" in critical|high|medium|low) ;; *) echo "::error::fail-on must be critical, high, medium or low"; exit 1 ;; esac
          gated=$(num --argjson r "$rank" --arg t "$FAIL_ON" '[.[] | select(($r[.severity] // 0) >= $r[$t])] | length' <<<"$sel")
        fi
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "gated=$gated" >> "$GITHUB_OUTPUT"
        if [ "$SUMMARY" != none ]; then
          {
            echo "## PandaWard"
            echo
            pandaward status --json | jq -r '"Assessment `\(.assessment.id)`: \(.assessment.status). Decisive coverage: \(.coverage.decisive_controls)/\(.coverage.applicable_controls) applicable controls."'
            echo
            echo "| Severity | Findings ($scope) |"
            echo "|---|---|"
            for s in critical high medium low info; do
              echo "| $s | $(num --arg s "$s" '[.[] | select(.severity == $s)] | length' <<<"$sel") |"
            done
            if [ "$SUMMARY" = full ] && [ "$findings" -gt 0 ]; then
              echo
              echo "| ID | Severity | Title | Location |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.id) | \(.severity) | \(.title | gsub("\\|"; "/")) | `\(.file):\(.start_line)` |"' <<<"$sel"
            fi
            echo
            echo "Hypotheses are not counted. BLOCKED, UNSUPPORTED and SUSPECTED controls are gaps, not passes; see the full report."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$gated" -gt 0 ]; then
          echo "::error::PandaWard: $gated $scope finding(s) at or above $FAIL_ON"
          exit 4
        fi
