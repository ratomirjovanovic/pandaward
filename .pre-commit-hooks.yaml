# pre-commit hooks for Pandaward. Run `pandaward init` once in the project first.
# The scan reads the working tree, not only the staged files.

# Builds Pandaward from this repository at the pinned rev (needs Go 1.23+).
- id: pandaward
  name: Pandaward passive scan
  description: Fail the commit when open high or critical findings exist.
  entry: pandaward scan --quiet --fail-on high
  language: golang
  pass_filenames: false
  always_run: true
  require_serial: true

# Uses a pandaward binary already on PATH (plugin, release download, package).
- id: pandaward-system
  name: Pandaward passive scan (installed binary)
  description: Fail the commit when open high or critical findings exist.
  entry: pandaward scan --quiet --fail-on high
  language: system
  pass_filenames: false
  always_run: true
  require_serial: true
