rules:
  - id: pandaward-js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code evaluation of a non-constant value. If any part of it is attacker-controlled this is code injection.
    metadata:
      pandaward-control: D-001
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
          - pattern: Function(..., $X)
          - pattern: setTimeout($X, ...)
          - pattern: setInterval($X, ...)
      - pattern-not: eval("...")
      - pattern-not: new Function(..., "...")
      - pattern-not: Function(..., "...")
      - pattern-not: setTimeout(function (...) {...}, ...)
      - pattern-not: setTimeout((...) => {...}, ...)
      - pattern-not: setTimeout((...) => $E, ...)
      - pattern-not: setTimeout($F, ...)
      - pattern-not: setInterval(function (...) {...}, ...)
      - pattern-not: setInterval((...) => {...}, ...)
      - pattern-not: setInterval((...) => $E, ...)
      - pattern-not: setInterval($F, ...)
      - pattern-not: setTimeout("...", ...)

  - id: pandaward-js-shell-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: A shell command is built from a non-constant string. Use execFile/spawn with an argument array and no shell.
    metadata:
      pandaward-control: D-002
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    patterns:
      - pattern-either:
          # child_process.exec and execSync run their argument through the
          # shell, however the module or the function was imported.
          - patterns:
              - pattern-either:
                  - pattern: require('child_process').$EXEC($CMD, ...)
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $CP = require('child_process');
                              ...
                          - pattern-inside: |
                              $CP = require('child_process')
                              ...
                          - pattern-inside: |
                              import * as $CP from 'child_process';
                              ...
                          - pattern-inside: |
                              import $CP from 'child_process';
                              ...
                      - pattern: $CP.$EXEC($CMD, ...)
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $FN = require('child_process').$EXEC;
                              ...
                          - pattern-inside: |
                              const {..., $EXEC: $FN, ...} = require('child_process');
                              ...
                      - pattern: $FN($CMD, ...)
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              const {..., $EXEC, ...} = require('child_process');
                              ...
                          - pattern-inside: |
                              import { ..., $EXEC, ... } from 'child_process';
                              ...
                      - pattern: $EXEC($CMD, ...)
              - metavariable-regex:
                  metavariable: $EXEC
                  regex: ^(exec|execSync)$
          # shelljs runs its argument through the shell too.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $SH = require('shelljs');
                      ...
                  - pattern-inside: |
                      import * as $SH from 'shelljs';
                      ...
              - pattern: $SH.exec($CMD, ...)
          # exec wrapped by util.promisify, and execa's shell helpers.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $P = promisify(exec);
                      ...
                  - pattern-inside: |
                      $P = $U.promisify(exec);
                      ...
                  - pattern-inside: |
                      $P = promisify($CP.exec);
                      ...
                  - pattern-inside: |
                      $P = $U.promisify($CP.exec);
                      ...
                  - pattern-inside: |
                      $P = promisify(require('child_process').exec);
                      ...
              - pattern: $P($CMD, ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $FN = require('execa').$M;
                      ...
                  - pattern-inside: |
                      const {..., $M: $FN, ...} = require('execa');
                      ...
              - pattern: $FN($CMD, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(shell|shellSync|command|commandSync)$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $X = require('execa');
                      ...
                  - pattern-inside: |
                      import $X from 'execa';
                      ...
              - pattern: $X.$M($CMD, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(shell|shellSync|command|commandSync)$
          - pattern: |
              $CP.spawn($CMD, $ARGS, {..., shell: true, ...})
          - pattern: |
              $CP.spawn("cmd.exe", ["/C", ...], ...)
          - pattern: |
              $CP.spawn("sh", ["-c", ...], ...)
      - pattern-not: $F("...", ...)
      - pattern-not: $CP.$F("...", ...)

  - id: pandaward-js-sql-string
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL text is built with string concatenation or template interpolation. Use parameterized queries.
    metadata:
      pandaward-control: D-003
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
    # A value that is an UPPER_CASE module constant (or a property of one),
    # a list built from one with .map(...).join(...), or a number cannot
    # carry request data, so it is not reported on its own (#160). The
    # constant may be followed by a property chain before .map (#221). A
    # template interpolation that is a ternary choosing between two string
    # literals only selects fixed SQL text, so it is not reported (#221).
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $DB.$Q("$SQL" + $X, ...)
                  - pattern: $DB.$Q(`...${$X}...`, ...)
              - metavariable-regex:
                  metavariable: $X
                  # Semgrep binds a template interpolation without its ${...};
                  # Opengrep binds it with them. Both forms are checked.
                  regex: (?s)^(?:\$\{(?!(?:[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*|[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*\.map\(.*\)\.join\([^()]*\)|(Math\.(trunc|floor|ceil|round)|Number|parseInt|parseFloat)\([^()]*\)|\d+(\.\d+)?|[^'"\x60]*\?\s*(?:"[^"]*"|'[^']*')\s*:\s*(?:"[^"]*"|'[^']*'))\}$)|(?!\$\{)(?!(?:[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*|[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*\.map\(.*\)\.join\([^()]*\)|(Math\.(trunc|floor|ceil|round)|Number|parseInt|parseFloat)\([^()]*\)|\d+(\.\d+)?|[^'"\x60]*\?\s*(?:"[^"]*"|'[^']*')\s*:\s*(?:"[^"]*"|'[^']*'))$))
          - patterns:
              - pattern: $DB.$Q($A + $B, ...)
              - metavariable-regex:
                  metavariable: $B
                  regex: (?s)^(?!(?:[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*|[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*\.map\(.*\)\.join\([^()]*\)|(Math\.(trunc|floor|ceil|round)|Number|parseInt|parseFloat)\([^()]*\)|\d+(\.\d+)?|"[^"]*"|'[^']*')$)
          - patterns:
              - pattern: $DB.$Q($A + $B, ...)
              - metavariable-regex:
                  metavariable: $A
                  regex: (?s)^(?!(?:(?:[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*|[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*\.map\(.*\)\.join\([^()]*\)|(Math\.(trunc|floor|ceil|round)|Number|parseInt|parseFloat)\([^()]*\)|\d+(\.\d+)?|"[^"]*"|'[^']*')(?:\s*\+\s*(?:[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*|[A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*\.map\(.*\)\.join\([^()]*\)|(Math\.(trunc|floor|ceil|round)|Number|parseInt|parseFloat)\([^()]*\)|\d+(\.\d+)?|"[^"]*"|'[^']*'))*)$)
      - metavariable-regex:
          metavariable: $Q
          regex: ^(query|execute|raw|run|all|prepare|\$queryRawUnsafe|\$executeRawUnsafe)$
      - pattern-not: $DB.$Q("..." + "...", ...)

  - id: pandaward-js-html-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: A non-constant value is written into raw HTML. Escape it or use textContent.
    metadata:
      pandaward-control: H-001
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: $EL.insertAdjacentHTML($POS, $X)
          - pattern: document.write($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: document.write("...")
      # A bare UPPER_CASE module constant (or a property of one) is fixed
      # markup, such as an inline SVG icon (#220).
      - metavariable-regex:
          metavariable: $X
          regex: ^(?![A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*$)

  - id: pandaward-js-jquery-html
    languages: [javascript, typescript]
    severity: WARNING
    message: A non-constant value is passed to a jQuery method that parses HTML. Escape it, or use .text() or $('<tag>').text(value).
    metadata:
      pandaward-control: H-001
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $EL.html($X)
              - pattern-not: $EL.html("...")
              - pattern-not: $EL.html($A.html())
              - pattern-not: $EL.html($A.text())
              - metavariable-regex:
                  metavariable: $X
                  regex: ^(?![A-Z][A-Z0-9_]*(\.[A-Za-z_$][\w$]*)*$)(?!\$\w*$)(?!\$\()
          - patterns:
              - pattern-either:
                  - pattern: $($A + $B)
                  - pattern: jQuery($A + $B)
                  - pattern: $EL.append($A + $B)
                  - pattern: $EL.prepend($A + $B)
                  - pattern: $EL.after($A + $B)
                  - pattern: $EL.before($A + $B)
                  - pattern: $EL.replaceWith($A + $B)
              - metavariable-regex:
                  metavariable: $A
                  # A bare '<' + tagName builds an element from a tag name,
                  # not markup with text in it.
                  regex: ^["'`]\s*<(?!["'`]\s*\+)
          - patterns:
              - pattern-either:
                  - pattern: $DOC.execCommand("$CMD", $B, $X)
              - metavariable-regex:
                  metavariable: $CMD
                  regex: (?i)^inserthtml$
              - pattern-not: $DOC.execCommand("$CMD", $B, "...")
          - patterns:
              - pattern: $DOC.createElement($A + $B)

  - id: pandaward-js-jquery-plugin-option
    languages: [javascript, typescript]
    severity: WARNING
    message: A plugin option is passed to jQuery, which parses a string that starts with '<' as HTML. Look it up with $(document).find(option) instead.
    metadata:
      pandaward-control: H-001
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
    patterns:
      - pattern-either:
          - pattern: $(<... this.$OPTS.$P ...>)
          - pattern: jQuery(<... this.$OPTS.$P ...>)
          - patterns:
              - pattern: $EL.$M(this.$OPTS.$P)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(appendTo|prependTo|insertAfter|insertBefore|replaceAll|wrap|wrapAll|wrapInner|append|prepend|after|before|html|replaceWith)$
      - metavariable-regex:
          metavariable: $OPTS
          regex: ^_?(options|opts|config|settings)$
      # The template option is markup by design.
      - metavariable-regex:
          metavariable: $P
          regex: ^(?!template$)

  - id: pandaward-js-jwt-none-alg
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT verification accepts the 'none' algorithm, so unsigned tokens are valid.
    metadata:
      pandaward-control: B-001
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
    pattern-either:
      - pattern: |
          $JWT.verify($T, $K, {..., algorithms: [..., 'none', ...], ...}, ...)
      - pattern: |
          $JWT.verify($T, $K, {..., algorithms: [..., "none", ...], ...}, ...)

  - id: pandaward-js-ssrf
    languages: [javascript, typescript]
    severity: WARNING
    message: An outbound request URL comes from the incoming request. Validate it against an allowlist to prevent SSRF.
    metadata:
      pandaward-control: D-006
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
          # db.query(...) and the like are method calls, not request data.
          - pattern-not-inside: $REQ.query(...)
          - pattern-not-inside: $REQ.body(...)
          - pattern-not-inside: $REQ.params(...)
    # A fixed origin: a literal scheme and host, or an UPPER_CASE base URL
    # constant, followed by "/". Only the path or query varies, so the
    # request cannot be sent to another host (#157).
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $BASE + "$PATH"
              - pattern: $BASE + "$PATH" + $REST
          - metavariable-regex:
              metavariable: $BASE
              regex: ^[A-Z][A-Z0-9_]*$
          - metavariable-regex:
              metavariable: $PATH
              regex: ^/
      - pattern-regex: '`(https?://[^/`$]+|\$\{[A-Z][A-Z0-9_]*\})/[^`]*`'
      - patterns:
          - pattern: '"$ORIGIN" + $REST'
          - metavariable-regex:
              metavariable: $ORIGIN
              regex: ^https?://[^/]+/
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$M($URL, ...)
              - pattern: got($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.request($URL, ...)
          - focus-metavariable: $URL

  - id: pandaward-js-path-traversal
    languages: [javascript, typescript]
    severity: WARNING
    message: A file path comes from the incoming request or from an archive entry name. Resolve it and check it stays inside the intended directory.
    metadata:
      pandaward-control: D-006
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $REQ.$F
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(req|request|ctx|ctx\.request|this\.request)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(query|body|params|url|originalUrl|path|headers|cookies|files|file)$
          # db.query(...) and the like are method calls, not request data.
          - pattern-not-inside: $REQ.$F(...)
      # The name of an entry in an archive being extracted (Zip Slip).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $X.on("entry", function ($E, ...) { ... })
              - pattern-inside: |
                  $X.on("entry", ($E, ...) => { ... })
          - pattern-either:
              - pattern: $E.path
              - pattern: $E.name
              - pattern: $E.fileName
              - pattern: $E.linkname
              - pattern: $E.linkpath
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $FS.$M($P, ...)
                  - metavariable-regex:
                      metavariable: $FS
                      regex: (?i)^(.*\.)?(\w*fs\w*|filesystem)(\.promises)?$
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|open|openSync|stat|statSync|lstat|lstatSync|exists|existsSync|readdir|readdirSync|unlink|unlinkSync|rmdir|rmdirSync|rm|rmSync|mkdir|mkdirSync|rename|renameSync|copyFile|copyFileSync|symlink|symlinkSync|link|linkSync|chmod|chmodSync|access|accessSync|realpath|realpathSync|outputFile|outputFileSync|remove|removeSync|copy|copySync|move|moveSync|ensureDir|ensureFile|pathExists)$
              - pattern: $RES.sendFile($P, ...)
              - pattern: $RES.download($P, ...)
              - pattern: send($REQ, $P, ...)
              - pattern: "$W.Writer({..., path: $P, ...})"
              - pattern: "Writer({..., path: $P, ...})"
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: path.basename(...)

  - id: pandaward-js-prototype-pollution
    languages: [javascript, typescript]
    severity: WARNING
    message: A recursive merge or deep assignment copies keys from its input without skipping __proto__, constructor and prototype, so a key named __proto__ in the input changes Object.prototype for the whole process.
    metadata:
      pandaward-control: D-006
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes"
    patterns:
      - pattern-either:
          - pattern-inside: |
              for ($K in $SRC) { ... }
          - pattern-inside: |
              for (var $K in $SRC) { ... }
          - pattern-inside: |
              for (let $K in $SRC) { ... }
          - pattern-inside: |
              for (const $K in $SRC) { ... }
          - pattern-inside: |
              $X.forEach(function ($K, ...) { ... })
          - pattern-inside: |
              $X.forEach(($K, ...) => { ... })
          - pattern-inside: |
              for (const $K of $SRC) { ... }
          - pattern-inside: |
              for (let $K of $SRC) { ... }
          - pattern-inside: |
              for (var $K of $SRC) { ... }
      # The function calls itself.
      - pattern-either:
          - pattern-inside: |
              function $F(...) { $...BODY }
          - pattern-inside: |
              $F = function (...) { $...BODY }
          - pattern-inside: |
              $F = (...) => { $...BODY }
          - pattern-inside: |
              $G = function $F(...) { $...BODY }
          - pattern-inside: |
              $F = $G = function (...) { $...BODY }
          - pattern-inside: |
              $F = $G = (...) => { $...BODY }
      - metavariable-pattern:
          metavariable: $...BODY
          pattern: $F(...)
      - pattern: $T[$K] = $V
      # The function reads the target's existing value under that key and
      # merges into it, so a key "__proto__" leads the merge into
      # Object.prototype. Writing into a fresh object cannot reach it.
      - metavariable-pattern:
          metavariable: $...BODY
          pattern-either:
            - pattern: $H(..., <... $T[$K] ...>, ...)
            - pattern: $Y = <... $T[$K] ...>
      # A check for the dangerous keys, or that the key is the target's
      # own property, guards the write.
      - pattern-not-inside: |
          if (<... "__proto__" ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... Object.hasOwn($T, $K) ...>) $S
      - pattern-not-inside: |
          if (<... $T.hasOwnProperty($K) ...>) $S
      - pattern-not-inside: |
          if (<... Object.prototype.hasOwnProperty.call($T, $K) ...>) $S
      - pattern-not-inside: |
          if (<... $K === "__proto__" ...>) ...
          ...

  - id: pandaward-js-reflected-xss
    languages: [javascript, typescript]
    severity: ERROR
    message: Request data is written into the HTTP response without HTML encoding. Encode it, or send it as JSON or plain text.
    metadata:
      pandaward-control: D-001
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $REQ.$F
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(req|request|ctx|ctx\.request|this\.request)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(query|body|params|url|originalUrl|path|headers|cookies)$
          - pattern-not-inside: $REQ.$F(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.status($C).send($X)
              - pattern: $RES.write($X, ...)
              - pattern: $RES.end($X, ...)
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^(res|response|resp)$
          - focus-metavariable: $X
    pattern-sanitizers:
      - patterns:
          - pattern: $ESC(...)
          - metavariable-regex:
              metavariable: $ESC
              regex: (?i)^(.*\.)?\w*(escape|encode|sanitize|purify)\w*$
      - pattern: JSON.stringify(...)
      - pattern: encodeURIComponent(...)

  - id: pandaward-js-error-to-html
    languages: [javascript, typescript]
    severity: WARNING
    message: "An error is sent as the response body. Express sends a string as HTML, and error messages often repeat request input; send a fixed message or JSON."
    metadata:
      pandaward-control: H-001
      cwe: "CWE-209: Generation of Error Message Containing Sensitive Information"
    patterns:
      - pattern-either:
          - pattern-inside: |
              function ($ERR, ...) { ... }
          - pattern-inside: |
              ($ERR, ...) => { ... }
          - pattern-inside: |
              try { ... } catch ($ERR) { ... }
      - metavariable-regex:
          metavariable: $ERR
          regex: ^(err|error|e|ex|exc)$
      - pattern-either:
          - pattern: $RES.send($ERR)
          - pattern: $RES.status($C).send($ERR)
          - pattern: $RES.end($ERR)
          - pattern: $RES.send($ERR.message)
          - pattern: $RES.status($C).send($ERR.message)
          - pattern: $RES.end($ERR.message)
          - pattern: "$RES.send($A ? $ERR : $B)"
          - pattern: "$RES.status($C).send($A ? $ERR : $B)"
      - metavariable-regex:
          metavariable: $RES
          regex: (?i)^(res|response|resp)$

  - id: pandaward-js-incomplete-sanitization
    languages: [javascript, typescript]
    severity: WARNING
    message: "This replace() escapes or removes only the first match, or removes a sequence a single pass can rebuild. Use a regular expression with the g flag, or a proper encoder."
    metadata:
      pandaward-control: D-006
      cwe: "CWE-116: Improper Encoding or Escaping of Output"
    pattern-either:
      # A string pattern replaces only its first occurrence.
      - patterns:
          - pattern: $S.replace("$LIT", $R)
          - metavariable-regex:
              metavariable: $LIT
              regex: ^(['"<>&`\\]|\\\\|/?\.\./?|/\.\./)$
      # A regular expression of escape characters without the g flag.
      - patterns:
          - pattern: $S.replace($RE, $R)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/(\[[^\]\w\s]+\]|\(?\\?[^\w\s()|]\\?[^\w\s()|]?(\|\\?[^\w\s()|]\\?[^\w\s()|]?)+\)?|\\\\)/[imsuy]*$
      # Removing a markup or traversal sequence in one pass: removing the
      # inner match can join the remainder into a new one.
      - patterns:
          - pattern: $S.replace($RE, "")
          - metavariable-regex:
              metavariable: $RE
              regex: ^/.*(<!--|<script|\\\.\\\.[\\/]).*/[a-z]*$

  - id: pandaward-js-incomplete-url-scheme-check
    languages: [javascript, typescript]
    severity: WARNING
    message: "The check rejects javascript: URLs but not data: or vbscript:, which also run script. Allow only http, https and mailto instead."
    metadata:
      pandaward-control: H-001
      cwe: "CWE-184: Incomplete List of Disallowed Inputs"
    patterns:
      - pattern-either:
          - pattern: $X.indexOf("$JS")
          - pattern: $X.startsWith("$JS")
          - pattern: $X.includes("$JS")
      - metavariable-regex:
          metavariable: $JS
          regex: (?i)^javascript:?$
      - pattern-not-inside: |
          if (<... "data:" ...>) $S
      - pattern-not-inside: |
          return <... "data:" ...>;

  - id: pandaward-js-open-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: "The redirect target comes from the request, so a link to this site can send users anywhere (a URL starting with // or a scheme). Redirect only to relative paths you check, or to an allowlist."
    metadata:
      pandaward-control: D-006
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $REQ.$F
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(req|request|ctx|ctx\.request|this\.request)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(query|body|params|url|originalUrl|path|headers)$
          - pattern-not-inside: $REQ.$F(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($X)
              - pattern: $RES.redirect($CODE, $X)
              - pattern: $RES.location($X)
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^(res|response|resp|ctx|this|ctx\.response|this\.response)$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", $X)
              - pattern: $RES.set("$H", $X)
              - pattern: $RES.header("$H", $X)
              - pattern: "$RES.writeHead($CODE, {..., $H: $X, ...})"
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']?location["']?$
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^(res|response|resp|ctx|this|ctx\.response|this\.response)$
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(.*\.)?\w*(allow|safe|valid|whitelist|sanitize)\w*$
